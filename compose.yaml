name: xingdu
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xingdu
      POSTGRES_DB: xingdu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xingdu -d xingdu"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://xingdu:${POSTGRES_PASSWORD}@db:5432/xingdu?sslmode=disable
      XINGDU_APP_DATABASE_PASSWORD: ${XINGDU_APP_DATABASE_PASSWORD:?Set a separate runtime database password in .env}
      XINGDU_CREDENTIAL_KEY: ${XINGDU_CREDENTIAL_KEY:-}
      XINGDU_WORKER_DATABASE_PASSWORD: ${XINGDU_WORKER_DATABASE_PASSWORD:?Set a worker database password in .env}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["server"]
    environment:
      DATABASE_URL: postgres://xingdu_app:${XINGDU_APP_DATABASE_PASSWORD}@db:5432/xingdu?sslmode=disable
      XINGDU_MIGRATION_DATABASE_URL: postgres://xingdu:${POSTGRES_PASSWORD}@db:5432/xingdu?sslmode=disable
      XINGDU_APP_DATABASE_PASSWORD: ${XINGDU_APP_DATABASE_PASSWORD:?Set a separate runtime database password in .env}
      XINGDU_WORKER_DATABASE_PASSWORD: ${XINGDU_WORKER_DATABASE_PASSWORD:?Set a worker database password in .env}
      XINGDU_HTTP_ADDR: 0.0.0.0:8080
      XINGDU_PUBLIC_ORIGIN: ${XINGDU_PUBLIC_ORIGIN:-http://127.0.0.1:15173}
      MODE: ${MODE:-self_hosted}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_PREMIUM_YEARLY: ${STRIPE_PRICE_PREMIUM_YEARLY:-}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${STRIPE_PRICE_PREMIUM_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
      STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
      XINGDU_REGISTRATION_ENABLED: ${XINGDU_REGISTRATION_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      XINGDU_EMAIL_FROM: ${XINGDU_EMAIL_FROM:-}
      XINGDU_GOOGLE_CLIENT_ID: ${XINGDU_GOOGLE_CLIENT_ID:-}
      XINGDU_GOOGLE_CLIENT_SECRET: ${XINGDU_GOOGLE_CLIENT_SECRET:-}
      XINGDU_GITHUB_CLIENT_ID: ${XINGDU_GITHUB_CLIENT_ID:-}
      XINGDU_GITHUB_CLIENT_SECRET: ${XINGDU_GITHUB_CLIENT_SECRET:-}
      XINGDU_AGENT_ORIGIN: ${XINGDU_AGENT_ORIGIN:-http://127.0.0.1:15173}
      XINGDU_CREDENTIAL_KEY: ${XINGDU_CREDENTIAL_KEY:-}
      XINGDU_SSH_ALLOWED_CIDRS: ${XINGDU_SSH_ALLOWED_CIDRS:-}
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      start_period: 5m
      retries: 12
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    environment:
      XINGDU_PUBLIC_ORIGIN: ${XINGDU_PUBLIC_ORIGIN:-http://127.0.0.1:15173}
      XINGDU_AGENT_ORIGIN: ${XINGDU_AGENT_ORIGIN:-http://127.0.0.1:15173}
      XINGDU_CREDENTIAL_KEY: ${XINGDU_CREDENTIAL_KEY:-}
      XINGDU_SSH_ALLOWED_CIDRS: ${XINGDU_SSH_ALLOWED_CIDRS:-}
      DATABASE_URL: postgres://xingdu_worker:${XINGDU_WORKER_DATABASE_PASSWORD}@db:5432/xingdu?sslmode=disable
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:15173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:

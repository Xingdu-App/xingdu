name: xingdu
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xingdu
      POSTGRES_DB: xingdu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xingdu -d xingdu"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["migrate"]
    environment: &backend_env
      DATABASE_URL: postgres://xingdu:${POSTGRES_PASSWORD}@db:5432/xingdu?sslmode=disable
      XINGDU_HTTP_ADDR: 0.0.0.0:8080
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["server"]
    environment: *backend_env
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:15173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:

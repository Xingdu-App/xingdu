server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ { proxy_pass http://api:8080; proxy_connect_timeout 3s; proxy_read_timeout 10s; }
    location /health/ { proxy_pass http://api:8080; proxy_connect_timeout 3s; proxy_read_timeout 10s; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

events {}
http {
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream control { zone control 64k; server api:8080 resolve; }
    server {
        listen 8443 ssl;
        server_name control.xingdu.test;
        ssl_certificate /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / { proxy_pass http://control; proxy_read_timeout 15s; }
    }
}

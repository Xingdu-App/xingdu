# Overlay: docker compose -f compose.yaml -f deploy/agent-lab/compose.yaml ...
# Disposable systemd containers need privileges INSIDE the Docker VM.
# No Docker socket, host PID/network/cgroup namespace, or host system mounts.
x-machine: &machine
  privileged: true
  cgroup: private
  tmpfs:
    - /run
    - /run/lock
    - /tmp:rw,noexec,nosuid,nodev,mode=1777
  volumes:
    - ./.local/agent-lab/ca.crt:/lab-ca/ca.crt:ro
  networks: [agent_lab]
  stop_grace_period: 15s
  mem_limit: 512m
  cpus: 1
  healthcheck:
    test: [CMD, systemctl, is-active, xingdu-lab-sshd]
    interval: 3s
    timeout: 3s
    retries: 30
services:
  api:
    environment:
      XINGDU_AGENT_ORIGIN: https://control.xingdu.test:8443
      XINGDU_SSH_ALLOWED_CIDRS: 172.30.88.0/24
    networks: [default, agent_lab]
  worker:
    environment:
      XINGDU_AGENT_ORIGIN: https://control.xingdu.test:8443
      XINGDU_SSH_ALLOWED_CIDRS: 172.30.88.0/24
    networks: [default, agent_lab]
  lab-tls:
    image: nginx:1.30-alpine
    volumes:
      - ./deploy/agent-lab/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.local/agent-lab/server.crt:/tls/server.crt:ro
      - ./.local/agent-lab/server.key:/tls/server.key:ro
    networks:
      default: {}
      agent_lab:
        aliases: [control.xingdu.test]
  lab-ubuntu:
    <<: *machine
    hostname: lab-ubuntu
    build:
      context: .
      dockerfile: deploy/agent-lab/Dockerfile
      args: {BASE_IMAGE: 'ubuntu:24.04'}
  lab-debian:
    <<: *machine
    hostname: lab-debian
    build:
      context: .
      dockerfile: deploy/agent-lab/Dockerfile
      args: {BASE_IMAGE: 'debian:13'}
  lab-amazon:
    <<: *machine
    hostname: lab-amazon
    build:
      context: .
      dockerfile: deploy/agent-lab/Dockerfile
      args: {BASE_IMAGE: 'public.ecr.aws/amazonlinux/amazonlinux:2023'}
networks:
  agent_lab:
    internal: true
    ipam:
      config:
        - subnet: 172.30.88.0/24

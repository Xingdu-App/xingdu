name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xingdu
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: xingdu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xingdu -d xingdu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XINGDU_TEST_DATABASE_URL: postgres://xingdu:ci-test-only@localhost:5432/xingdu_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o ./bin/ ./cmd/...
      - run: make agents
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
